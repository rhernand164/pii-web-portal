version: '3.8'

services:
  pii-web-portal:
    image: pii-web-portal:1.3 # Use the versioned tag
    container_name: pii_web_portal_nginx
    restart: always
    env_file:
      - .env.prod # Use a dedicated production env file
    ports:
      - "3001:3001" # Expose Web Portal port (adjust if needed)
    # The CMD from the Dockerfile handles envsubst and starting nginx


